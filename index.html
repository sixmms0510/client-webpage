<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Client Management</title>
    <meta
      name="description"
      content="Client information management system."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <main>
        <section class="contact-panel" id="add-client">
          <div class="contact-copy">
            <p class="eyebrow">Add New Client</p>
            <h2>Create a new client record.</h2>
          </div>

          <form class="contact-form" id="clientForm">
            <label>
              Full name
              <input type="text" id="clientName" placeholder="Client name" required />
            </label>
            <label>
              Email address
              <input type="email" id="clientEmail" placeholder="client@example.com" required />
            </label>
            <label>
              Phone number
              <input type="tel" id="clientPhone" placeholder="+1 (555) 000-0000" required />
            </label>
            <label>
              Description
              <textarea id="clientDescription" rows="3" placeholder="Client details and notes..."></textarea>
            </label>
            <label>
              Admin notification email
              <input type="email" id="adminEmail" placeholder="admin@example.com" required />
            </label>
            <button type="submit">Add Client</button>
          </form>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
